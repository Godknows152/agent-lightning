<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3e9">
  <title>鹈鹕的慢骑日记 · A little ride</title>
  <style>
    :root { color-scheme: light; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #294638; background: #f5f3e9; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(18px, 3.5vw, 52px); }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    main { max-width: 1440px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .eyebrow { display: flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 700; letter-spacing: 3px; }
    .brand-dot { width: 9px; height: 9px; background: #df8056; border-radius: 50%; }
    h1 { font-size: clamp(24px, 3.5vw, 42px); letter-spacing: -.04em; font-weight: 600; margin: 9px 0 0; }
    .header-note { font-size: 12px; color: #758175; text-align: right; line-height: 1.9; }
    .scene { --sky: #cce8e5; --horizon: #f5efcf; --hill: #a6bf97; --hill-near: #789a79; --grass: #b6c68e; --road: #e9dfba; position: relative; height: clamp(470px, 68vh, 760px); overflow: hidden; isolation: isolate; border-radius: 24px; background: var(--sky); transition: background 1.2s; }
    .scene[data-weather="cloudy"] { --sky: #c4d1d1; --horizon: #e3e6d7; --hill: #a3b5a1; --hill-near: #7c9989; --grass: #a9bc98; --road: #d7d5be; }
    .scene[data-weather="rainy"] { --sky: #95b4bf; --horizon: #d1dfe0; --hill: #91aaa0; --hill-near: #688a82; --grass: #95b09a; --road: #b8c6bc; }
    .sky-gradient { position: absolute; inset: 0; background: linear-gradient(0deg, var(--horizon), transparent 85%); transition: background 1.2s; }
    .scene-top { position: absolute; top: 28px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: start; z-index: 5; }
    .weather-badge { display: inline-flex; gap: 12px; align-items: center; padding: 12px 17px; border: 1px solid #ffffff80; border-radius: 50px; background: #fffdf1b8; backdrop-filter: blur(12px); }
    .weather-badge svg { width: 24px; height: 24px; fill: none; stroke: #526c59; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #weather-label { font-size: 13px; font-weight: 600; }
    .scene-caption { font-size: 10px; letter-spacing: 2px; line-height: 1.8; color: #48685b; text-align: right; }
    .sun { position: absolute; top: 15%; right: 19%; width: clamp(66px, 8vw, 105px); aspect-ratio: 1; border-radius: 50%; background: #f9d77d; box-shadow: 0 0 0 18px #fff0b02a, 0 0 0 40px #fff0b022; transition: opacity 1.2s, transform 1.2s; animation: sunshine 5s ease-in-out infinite; }
    [data-weather="cloudy"] .sun { opacity: .32; transform: translateY(12px); }
    [data-weather="rainy"] .sun { opacity: 0; transform: translateY(30px); }
    .cloud { position: absolute; width: 200px; height: 75px; color: #fffdf1; opacity: .85; transition: color 1.2s, opacity 1.2s; animation: drift 13s ease-in-out infinite alternate; }
    .cloud svg { width: 100%; height: 100%; fill: currentColor; }
    .cloud.one { top: 24%; left: 9%; width: 180px; }
    .cloud.two { top: 12%; left: 39%; width: 125px; animation-delay: -6s; opacity: .65; }
    .cloud.three { top: 26%; right: -2%; width: 240px; animation-delay: -3s; }
    .cloud.four { top: 12%; right: 12%; width: 260px; opacity: 0; animation-delay: -8s; }
    [data-weather="cloudy"] .cloud { color: #e9ede7; opacity: .95; }
    [data-weather="rainy"] .cloud { color: #d1dce0; opacity: 1; }
    .birds { position: absolute; top: 31%; left: 36%; width: 86px; opacity: .55; transition: opacity 1s; animation: drift 9s ease-in-out infinite alternate-reverse; }
    [data-weather="rainy"] .birds { opacity: 0; }
    .landscape { position: absolute; width: 100%; height: 54%; bottom: 0; }
    .hill, .grass, .road { transition: fill 1.2s; }
    .hill { fill: var(--hill); } .hill.near { fill: var(--hill-near); } .grass { fill: var(--grass); } .road { fill: var(--road); }
    .road-marks { animation: road 2s linear infinite; }
    .flowers { position: absolute; bottom: 4%; left: 0; width: 200%; height: 8%; animation: foreground 12s linear infinite; color: #6b8a63; }
    .rider { position: absolute; width: min(590px, 65%); height: auto; max-height: 80%; left: 50%; bottom: 18%; transform: translateX(-50%); overflow: visible; z-index: 3; }
    .rider-shadow { fill: #435e4c; opacity: .16; }
    .bicycle { animation: bob .7s ease-in-out infinite; }
    .body-bob { animation: bob .7s ease-in-out infinite; }
    .scarf-tail { transform-origin: 280px 199px; animation: flutter .7s ease-in-out infinite alternate; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .wind { fill: none; stroke: #fffdf3; stroke-width: 3; stroke-linecap: round; opacity: .6; animation: wind 1.8s ease-in-out infinite; }
    .rain { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 1.2s; overflow: hidden; }
    [data-weather="rainy"] .rain { opacity: .6; }
    .drop { position: absolute; top: -90px; width: 1.5px; height: 23px; border-radius: 2px; background: #f1f8f6; animation: rainfall linear infinite; }
    .puddles { opacity: 0; transition: opacity 1.2s; }
    [data-weather="rainy"] .puddles { opacity: .65; }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 1.2s ease-out infinite; }
    .scene-bottom { position: absolute; bottom: 25px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: end; z-index: 5; gap: 12px; }
    .quote { font-size: 13px; font-weight: 500; letter-spacing: 1px; margin: 0; }
    .quote small { display: block; font-size: 9px; font-weight: 400; letter-spacing: 2px; margin-top: 7px; opacity: .65; }
    .pause { display: grid; place-items: center; width: 42px; height: 42px; flex-shrink: 0; border: 1px solid #ffffff90; background: #fffdf1a8; border-radius: 50%; cursor: pointer; color: #294638; transition: background .2s; }
    .pause:hover { background: #fffdf1; } .pause:focus-visible { outline: 3px solid #294638; outline-offset: 3px; }
    .pause svg { width: 15px; height: 15px; fill: currentColor; }
    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 22px; padding-top: 22px; }
    .footer-note { font-size: 11px; color: #7b8477; line-height: 1.9; }
    .weather-cycle { display: flex; align-items: center; gap: 13px; }
    .step { width: 76px; color: #697766; font-size: 11px; transition: color .4s; }
    .step.active { color: #35533d; }
    .step-title { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .step-number { font: 9px ui-monospace, monospace; opacity: .65; }
    .track { height: 3px; margin-top: 9px; border-radius: 4px; background: #dedfd3; overflow: hidden; }
    .track span { display: block; width: 100%; height: 100%; background: #dd855e; transform: scaleX(0); transform-origin: left; }
    .cycle-arrow { color: #949d8c; font-size: 11px; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes flutter { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
    @keyframes blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
    @keyframes sunshine { 50% { box-shadow: 0 0 0 22px #fff0b02a, 0 0 0 48px #fff0b015; } }
    @keyframes drift { from { transform: translateX(-15px); } to { transform: translateX(25px); } }
    @keyframes road { to { transform: translateX(-160px); } }
    @keyframes foreground { to { transform: translateX(-50%); } }
    @keyframes wind { 0%,100% { opacity: 0; transform: translateX(15px); } 50% { opacity: .7; transform: translateX(-10px); } }
    @keyframes rainfall { from { transform: translate(0, -30px) rotate(16deg); } to { transform: translate(-180px, 950px) rotate(16deg); } }
    @keyframes ripple { from { transform: scale(.3); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }
    @media (max-width: 600px) {
      body { padding: 22px 14px 24px; }
      header { margin-bottom: 21px; } .header-note { display: none; }
      .eyebrow { font-size: 9px; letter-spacing: 2px; } h1 { margin-top: 10px; font-size: 29px; }
      .scene { height: 65vh; height: 65svh; min-height: 430px; max-height: 670px; border-radius: 19px; }
      .scene-top { top: 19px; left: 18px; right: 18px; }
      .weather-badge { padding: 10px 13px; gap: 8px; } .scene-caption { font-size: 8px; letter-spacing: 1px; }
      .sun { right: 18%; top: 23%; width: 69px; }
      .cloud.one { top: 30%; left: -18%; width: 175px; } .cloud.two { top: 15%; left: 21%; width: 115px; }
      .cloud.three { right: -32%; top: 37%; width: 210px; } .cloud.four { right: 0; top: 23%; width: 205px; }
      .birds { top: 37%; left: 30%; width: 65px; }
      .landscape { height: 43%; } .rider { width: 96%; bottom: 15%; }
      .scene-bottom { left: 19px; right: 17px; bottom: 21px; } .quote { font-size: 11px; } .quote small { font-size: 8px; letter-spacing: 1px; }
      footer { flex-direction: column-reverse; align-items: stretch; gap: 18px; padding-top: 22px; }
      .weather-cycle { justify-content: space-between; gap: 10px; } .step { width: auto; flex: 1; } .footer-note { text-align: center; font-size: 10px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      body { padding: 16px 24px; } header { margin-bottom: 14px; } h1 { font-size: 25px; }
      .scene { height: 72vh; min-height: 300px; } .rider { width: min(320px, 48%); } .scene-top { top: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene *, .scene *::before, .scene *::after { animation: none !important; transition-duration: .01s !important; }
    }
  </style>
</head>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const scene = $('scene');
  const steps = [...document.querySelectorAll('.step')];
  const bars = steps.map(step => step.querySelector('.track span'));
  const weather = [
    { key: 'sunny', label: '晴天 · 阳光正好', quote: '不赶时间，只追阳光。', icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>' },
    { key: 'cloudy', label: '阴天 · 云朵作伴', quote: '云朵路过，心情放晴。', icon: '<path d="M6 18a4 4 0 0 1-1-7.9 6 6 0 0 1 11.7-1.2A4.6 4.6 0 1 1 18 18Z"/>' },
    { key: 'rainy', label: '雨天 · 听雨前行', quote: '一点小雨，也是风景。', icon: '<path d="M6 14a3.5 3.5 0 0 1-1-6.9 5.5 5.5 0 0 1 10.7-1A4 4 0 1 1 18 14ZM7 17l-1 3m6-3-1 3m6-3-1 3"/>' }
  ];
  // Everything is local: SVG illustrations, rain, styles and animation logic.
  const drops = document.createDocumentFragment();
  for (let i = 0; i < 65; i++) {
    const drop = document.createElement('i');
    drop.className = 'drop';
    drop.style.left = `${(i * 37.73) % 120}%`;
    drop.style.animationDuration = `${.85 + (i % 7) * .085}s`;
    drop.style.animationDelay = `${-(i * .137) % 2}s`;
    drop.style.opacity = String(.3 + (i % 5) * .14);
    drops.appendChild(drop);
  }
  $('rain').appendChild(drops);
  let paused = false;
  let elapsed = 0;
  let last = performance.now();
  let current = -1;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const rearWheel = $('rear-wheel'), frontWheel = $('front-wheel');
  const nearLeg = $('near-leg-path'), farLeg = $('far-leg-path');
  const nearFoot = $('near-foot'), farFoot = $('far-foot');
  const nearPedal = $('near-pedal'), farPedal = $('far-pedal');
  const crank = $('crank');
  function setWeather(index) {
    const state = weather[index];
    scene.dataset.weather = state.key;
    $('weather-label').textContent = state.label;
    $('weather-icon').innerHTML = state.icon;
    $('quote').firstChild.textContent = state.quote;
    steps.forEach((step, i) => { step.classList.toggle('active', i === index); if (i === index) step.setAttribute('aria-current', 'step'); else step.removeAttribute('aria-current'); });
  }
  function pedal(time) {
    const angle = time / 1150 * Math.PI * 2;
    const x = Math.cos(angle) * 27, y = Math.sin(angle) * 27;
    const nx = 292 + x, ny = 345 + y, fx = 292 - x, fy = 345 - y;
    rearWheel.setAttribute('transform', `rotate(${time / 1150 * 360})`);
    frontWheel.setAttribute('transform', `rotate(${time / 1150 * 360})`);
    crank.setAttribute('transform', `rotate(${time / 1150 * 360} 292 345)`);
    // Two connected legs follow opposite ends of the same crank.
    nearLeg.setAttribute('d', `M254 257 Q244 299 ${nx} ${ny - 4}`);
    farLeg.setAttribute('d', `M263 246 Q320 276 ${fx} ${fy - 4}`);
    nearFoot.setAttribute('transform', `translate(${nx - 319} ${ny - 345})`);
    farFoot.setAttribute('transform', `translate(${fx - 269} ${fy - 347})`);
    nearPedal.setAttribute('d', `M${nx - 13} ${ny + 6}h29`);
    farPedal.setAttribute('d', `M${fx - 14} ${fy + 6}h29`);
  }
  function frame(now) {
    if (!paused) elapsed += now - last;
    last = now;
    const index = Math.floor(elapsed / 5000) % weather.length;
    if (index !== current) { current = index; setWeather(index); }
    const progress = elapsed % 5000 / 5000;
    bars.forEach((bar, i) => { bar.style.transform = `scaleX(${i === current ? progress : 0})`; });
    if (!paused && !reducedMotion.matches) pedal(elapsed);
    requestAnimationFrame(frame);
  }
  $('pause').addEventListener('click', () => {
    paused = !paused;
    scene.classList.toggle('paused', paused);
    $('pause').setAttribute('aria-pressed', String(paused));
    $('pause').setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
    $('pause').innerHTML = paused ? '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 2 10 6-10 6Z"/></svg>' : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3v12H3zM10 2h3v12h-3z"/></svg>';
    last = performance.now();
  });
  requestAnimationFrame(frame);
})();
</script>
