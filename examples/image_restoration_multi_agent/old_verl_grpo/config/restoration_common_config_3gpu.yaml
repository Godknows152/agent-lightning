# 训练入口沿用“3GPU”命名，但实际使用四张物理卡：GPU0/1 用于 Actor、参考策略和 TP2 SGLang，
# GPU2/3 各自常驻一套图像修复模型与 IQA。Ray 只注册 GPU0/1 两个训练资源。

defaults:
  - restoration_common_config_2gpu
  - _self_

actor_rollout_ref:
  rollout:
    agent:
      # AgentLoop 不向 Ray 申请 GPU；它通过工具配置直接使用逻辑 cuda:2、cuda:3。
      num_gpus_per_worker: 0.0
    multi_turn:
      # 工具独占逻辑 cuda:2、cuda:3，无需与 GPU0/1 上的 SGLang 分阶段。
      phase_separated_tool_execution: false
      tool_config_path: examples/image_restoration_multi_agent/old_verl_grpo/config/tool_config/v2/restoration_tool_config_3gpu.yaml

trainer:
  experiment_name: "fog_3gpu_${now:%m%d}"
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog_merged_sft_0716/3gpu
  # 只向 Ray 注册两个训练 GPU；另外两张可见 CUDA 设备保留给零 GPU 资源的工具进程。
  n_gpus_per_node: 2
  total_training_steps: null # 不固定总步骤数，由数据量和 total_epochs 推导
  ray_kwargs:
    ray_init:
      num_gpus: 2
      runtime_env:
        env_vars:
          CUDA_VISIBLE_DEVICES: "0,1,2,3"
          RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: "1"
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog_merged_sft_0716/3gpu/swanlab"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/log/3gpu"
