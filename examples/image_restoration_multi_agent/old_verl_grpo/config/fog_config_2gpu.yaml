# Old-verl GRPO config for fog expert on 2 trainer GPUs.

hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - restoration_common_config_2gpu
  - _self_

data:
  train_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/fog_train.parquet
  val_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/fog_val.parquet

actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/Merged/fog
    lora_adapter_path: null

trainer:
  experiment_name: fog_0716
  resume_mode: auto
  resume_from_path: null
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog_merged_sft_0716
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog_merged_sft_0716/swanlab"
