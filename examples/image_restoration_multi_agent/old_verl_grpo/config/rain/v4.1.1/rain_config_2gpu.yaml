# Old-verl GRPO config for rain expert on 2 trainer GPUs (v4.1.2).
# v4.1.2: Full-trajectory normalized legal-action first-token entropy regularization

hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - restoration_common_config_2gpu
  - _self_

data:
  train_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/rain_train.parquet
  val_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/rain_val.parquet

actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/Models/Qwen3.5-9B
    # Actor 从 0731 rain SFT LoRA 初始化并继续更新；冻结参考策略加载同一份初始 LoRA。
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/qwen3_5_0731/format_cold_start/rain
  rollout:
    multi_turn:
      tool_config_path: examples/image_restoration_multi_agent/old_verl_grpo/config/tool_config/v2/restoration_tool_config_2gpu.yaml
  actor:
    entropy_coeff: 0.001
    # v4.1.2: Average normalized first-token entropy within each trajectory.
    decision_point_entropy_coeff: 0.0
    decision_point_first_token_entropy_coeff: 0.002
    # v4.1.2: warmup-stable-cosine decay; config source remains under the v4.1.1 directory.
    decision_point_first_token_entropy_schedule: wsd_cosine
    decision_point_first_token_entropy_coeff_end: 0.0002
    decision_point_first_token_entropy_ramp_ratio: 0.05
    decision_point_first_token_entropy_stable_end_ratio: 0.20
    decision_point_first_token_entropy_decay_end_ratio: 0.85

trainer:
  project_name: RainRL
  experiment_name: "rain_v4.1.2"
  resume_mode: auto
  resume_from_path: null
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/rain/v4.1.2/2gpu
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/rain/v4.1.2/2gpu/swanlab"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/log/rain/v4.1.2/2gpu"
