# Old-verl v3 GRPO config for rain expert on 2 trainer GPUs.

hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - restoration_common_config_v3_2gpu
  - _self_

data:
  train_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/rain_train.parquet
  val_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/rain_val.parquet

actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/Models/Qwen3.5-9B
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/qwen3_5_0721/format_cold_start/rain

trainer:
  experiment_name: rain_v3
  resume_mode: auto
  resume_from_path: null
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/rain_v3
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/rain_v3/swanlab"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/log/rain/v3"
