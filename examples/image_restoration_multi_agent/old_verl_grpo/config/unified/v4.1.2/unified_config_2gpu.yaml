# Unified four-expert old-verl GRPO config on physical GPUs 0 and 1 (v4.1.2).
# v4.1.2: full-trajectory normalized legal-action first-token entropy scheduling.

hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - restoration_common_config_2gpu
  - _self_

data:
  val_max_samples: 64
  train_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/unified/unified_train.parquet
  val_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/unified/unified_val_balanced64.parquet

actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/Models/Qwen3.5-9B
    # Initialize both the trainable actor and frozen KL reference from unified SFT.
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/qwen3_5_0813/format_cold_start/unified
  rollout:
    multi_turn:
      tool_config_path: examples/image_restoration_multi_agent/old_verl_grpo/config/tool_config/v2/restoration_tool_config_2gpu.yaml
  actor:
    entropy_coeff: 0.001
    decision_point_entropy_coeff: 0.0
    decision_point_first_token_entropy_coeff: 0.004
    decision_point_first_token_entropy_schedule: wsd_cosine
    decision_point_first_token_entropy_coeff_end: 0.0004
    decision_point_first_token_entropy_ramp_ratio: 0.02
    decision_point_first_token_entropy_stable_end_ratio: 0.02
    decision_point_first_token_entropy_decay_end_ratio: 0.8

trainer:
  project_name: UnifiedExpertRL
  experiment_name: "unified_v4.1.2"
  resume_mode: auto
  resume_from_path: null
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/unified/v4.1.2/2gpu
  total_epochs: 3
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/unified/v4.1.2/2gpu/swanlab"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/log/unified/v4.1.2/2gpu"
