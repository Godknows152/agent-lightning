# Lowlight v4.1.2: GPU0/1 train and sample; physical GPU2 serves persistent restoration/IQA.

hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - restoration_common_config_3gpu
  - _self_

data:
  train_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/low_light_train.parquet
  val_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/low_light_val.parquet

actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/Models/Qwen3.5-9B
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/qwen3_5_0731/format_cold_start/low_light
  rollout:
    multi_turn:
      tool_config_path: examples/image_restoration_multi_agent/old_verl_grpo/config/tool_config/v2/restoration_tool_config_3gpu.yaml
  actor:
    entropy_coeff: 0.001
    decision_point_entropy_coeff: 0.0
    decision_point_first_token_entropy_coeff: 0.008
    # v4.1.2: warmup-stable-cosine decay to 30% of the initial coefficient; config source remains under the v4.1.2 directory.
    decision_point_first_token_entropy_schedule: wsd_cosine
    decision_point_first_token_entropy_coeff_end: 0.0024
    decision_point_first_token_entropy_ramp_ratio: 0.05
    decision_point_first_token_entropy_stable_end_ratio: 0.20
    decision_point_first_token_entropy_decay_end_ratio: 0.85

trainer:
  project_name: LowLightRL
  experiment_name: "lowlight_v4.1.2"
  resume_mode: auto
  resume_from_path: null
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/lowlight/v4.1.2/3gpu
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/lowlight/v4.1.2/3gpu/swanlab"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/log/lowlight/v4.1.2/3gpu"
