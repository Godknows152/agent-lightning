# Old-verl GRPO config: actor/SGLang train on GPU0/1, restoration/IQA tools stay on GPU2/3.

hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/fog_train.parquet
  val_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/fog_val.parquet
  val_max_samples: 32
  train_batch_size: 16
  max_prompt_length: 2048
  # Bound visual tokens for the runtime-reconstructed prompt. The image object
  # sent to SGLang is downscaled as well, so both processors see this budget.
  max_image_pixels: 589824  # 768 x 768
  # Stores model generations plus zero-loss reconstructed decision prompts.
  max_response_length: 3072
  return_raw_chat: true
  return_multi_modal_inputs: false

algorithm:
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.05

actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/Models/Qwen3.5-9B
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/qwen3_5/format_cold_start/fog
    trust_remote_code: true
    use_remove_padding: false
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear

  actor:
    freeze_vision_tower: true
    optim:
      lr: 1.0e-5
    entropy_coeff: 0.002
    ppo_epochs: 1
    use_kl_loss: true
    kl_loss_coef: 0.05
    kl_loss_type: low_var_kl
    fsdp_config:
      model_dtype: bfloat16
      param_offload: true
      optimizer_offload: true
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 2

  rollout:
    name: sglang
    load_format: auto
    dtype: bfloat16
    temperature: 0.5
    top_p: 0.9
    disable_multimodal_special_token_generation: true
    n: 3
    tensor_model_parallel_size: 1
    # Reserve enough token-pool capacity for the zero-loss reconstructed
    # decision context while keeping rollout concurrency modest on shared GPUs.
    gpu_memory_utilization: 0.30
    force_full_sleep_for_lora: true
    max_num_seqs: 4
    max_model_len: 9728
    enforce_eager: true
    log_prob_micro_batch_size_per_gpu: 1

    agent:
      num_workers: 1
      num_gpus_per_worker: 0.0
      default_agent_loop: tool_agent

    multi_turn:
      enable: true
      max_user_turns: 7
      max_assistant_turns: 6
      # Model-token budget across the full trajectory. Reconstructed prompts
      # and tool feedback remain available as context without using it.
      max_generated_response_length: 1536
      round_barrier_size: 0
      format: qwen3_coder
      tool_config_path: examples/image_restoration_multi_agent/old_verl_grpo/config/tool_config/restoration_tool_config_current_iqa_2gpu.yaml

  ref:
    log_prob_micro_batch_size_per_gpu: 1

trainer:
  logger:
    - console
    - swanlab
  project_name: 4expert_grpo
  experiment_name: fog_grpo_0702
  resume_mode: resume_path
  resume_from_path: examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog_0629/global_step_80
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog_0702
  log_val_generations: 2
  n_gpus_per_node: 2
  nnodes: 1
  save_freq: 10
  test_freq: 10
  total_epochs: 3
  total_training_steps: null
  max_actor_ckpt_to_keep: 2
  keep_best_validation_ckpt: true
  val_before_train: false
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          LD_LIBRARY_PATH: "/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/torch/lib:/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cudnn/lib"
          LD_PRELOAD: "/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cuda_runtime/lib/libcudart.so.12"
          PYTHONUNBUFFERED: "1"
          XFORMERS_IGNORE_FLASH_VERSION_CHECK: "1"
          SGLANG_DISABLE_CUDNN_CHECK: "1"
          RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: "1"
          RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog_0702/swanlab"
          SWANLAB_MODE: "cloud"
          VERL_LOGGING_LEVEL: "WARN"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/log"
