# Old-verl GRPO config for fog expert on 2 trainer GPUs (v4.1.4).
# v4.1.4: Quality-and-validity-gated legal-action first-token entropy with cosine decay.

hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - restoration_common_config_2gpu
  - _self_

data:
  train_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/fog_train.parquet
  val_files:
    - examples/image_restoration_multi_agent/old_verl_grpo/data/fog_val.parquet

actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/Models/Qwen3.5-9B
    # Actor 从 0731 fog SFT LoRA 初始化并继续更新；冻结参考策略加载同一份初始 LoRA。
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/qwen3_5_0731/format_cold_start/fog
  rollout:
    multi_turn:
      tool_config_path: examples/image_restoration_multi_agent/old_verl_grpo/config/tool_config/v2/restoration_tool_config_2gpu.yaml
  actor:
    entropy_coeff: 0.001
    # v4.1.4: Average normalized first-token entropy within each trajectory.
    decision_point_entropy_coeff: 0.0
    decision_point_first_token_entropy_coeff: 0.02
    decision_point_first_token_entropy_gate: quality_validity
    decision_point_first_token_entropy_min_pure_image_reward: 0.0
    decision_point_first_token_entropy_max_repeated_actions: 1
    # v4.1.4: 5% warmup, immediate cosine decay, floor reached at 40% of training.
    decision_point_first_token_entropy_schedule: wsd_cosine
    decision_point_first_token_entropy_coeff_end: 0.01
    decision_point_first_token_entropy_ramp_ratio: 0.05
    decision_point_first_token_entropy_stable_end_ratio: 0.05
    decision_point_first_token_entropy_decay_end_ratio: 0.8

trainer:
  project_name: FogRL
  experiment_name: "fog_v4.1.4"
  resume_mode: auto
  resume_from_path: null
  default_local_dir: examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog/v4.1.4/2gpu/0.008_end0.002
  total_epochs: 4
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          SWANLAB_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/outputs/fog/v4.1.4/2gpu/swanlab"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/old_verl_grpo/log/fog/v4.1.4/2gpu"
