expert_name: snow_expert
stage_config: ../../config/stage_h.yaml
model_path: ../../../../../Models/Qwen3.5-9B
adapter_path: ../../../../../Agent_Lightning/LlamaFactory/image_restoration_experts/outputs/qwen3_5/format_cold_start/snow
chat_template: ../templates/qwen35_native_tool_nothink.jinja
train_data: ../data/snow_train.jsonl
val_data: ../data/snow_val.jsonl
output_dir: ../outputs/qwen3_5_fresh/snow_2gpu
expert_vlm:
  # temperature/top_p inherit from training.temperature/top_p below.
  max_tokens: 128
swanlab:
  enabled: true
  project_name: image-restoration-multi-agent
  experiment_name: qwen3.5-snow-expert-grpo-2gpu
  mode: online
  smoke_mode: offline
  log_dir: ../outputs/qwen3_5_fresh/snow_2gpu/swanlab
training:
  # Dataset batch and GRPO candidate generation.
  train_batch_size: 8
  rollout_n: 3
  # Keep every GRPO candidate trajectory in flight so vLLM can continuously
  # batch requests from the same dialogue turn and pipeline later turns.
  n_runners: 24
  # Periodically delete old rollout artifact sample directories under grpo/artifacts.
  artifact_cleanup_enabled: true
  artifact_keep_sample_dirs: 256
  artifact_min_age_seconds: 7200
  artifact_cleanup_interval_rollouts: 48
  n_gpus_per_node: 2

  # Model and LoRA.
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules: all-linear
  freeze_vision_tower: true
  use_remove_padding: false
  enable_gradient_checkpointing: true
  enable_activation_offload: false
  enable_thinking: false

  # Release restoration/IQA GPU memory after rollout and reload it before the
  # next rollout phase. The HTTP service process itself remains alive.
  tool_runtime_lifecycle_enabled: true
  tool_runtime_control_url: http://127.0.0.1:8767
  tool_runtime_lifecycle_timeout_seconds: 1800

  # vLLM rollout engine and sampling.
  tensor_model_parallel_size: 2
  gpu_memory_utilization: 0.25
  max_num_batched_tokens: 8192
  max_num_seqs: 1024
  layered_summon: true
  enable_chunked_prefill: false
  enable_prefix_caching: true
  enforce_eager: false
  disable_custom_all_reduce: true
  free_cache_engine: false
  max_prompt_length: 4096
  max_response_length: 640
  trace_aggregator_level: trajectory
  force_one_sample_per_rollout: true
  trajectory_image_source: latest
  trajectory_max_prompt_length: 4096
  trajectory_max_response_length: 4096
  max_model_len: 16384
  temperature: 0.5
  top_k: -1
  top_p: 0.9
  do_sample: true
  ignore_eos: false

  # PPO update. In trajectory mode, each sampled rollout contributes one masked sequence.
  ppo_mini_batch_size: 8
  ppo_micro_batch_size_per_gpu: 2
  ppo_epochs: 1
  use_dynamic_bsz: false
  ppo_max_token_len_per_gpu: 4096
  loss_agg_mode: seq-mean-token-mean
  shuffle: false
  clip_ratio: 0.2
  clip_ratio_low: 0.2
  clip_ratio_high: 0.3
  grad_clip: 1.0

  # Actor old-log-prob and reference-policy forward batches.
  rollout_log_prob_micro_batch_size_per_gpu: 2
  rollout_log_prob_use_dynamic_bsz: false
  rollout_log_prob_max_token_len_per_gpu: 16384
  ref_log_prob_micro_batch_size_per_gpu: 2
  ref_log_prob_use_dynamic_bsz: false
  ref_log_prob_max_token_len_per_gpu: 16384
  ref_param_offload: true

  # Optimizer and regularization.
  learning_rate: 0.00001
  weight_decay: 0.01
  lr_scheduler_type: constant
  lr_warmup_steps_ratio: 0.0
  use_kl_loss: true
  kl_loss_coef: 0.05
  kl_loss_type: low_var_kl
  use_kl_in_reward: false
  entropy_coeff: 0.005

  # FSDP memory controls.
  fsdp_param_offload: true
  fsdp_optimizer_offload: true
  actor_use_torch_compile: true
  fsdp_use_torch_compile: false

  # Trainer lifecycle.
  total_epochs: 3
  save_freq: 10
  test_freq: 20
  resume_mode: auto
  max_actor_ckpt_to_keep: 2
  val_before_train: false
