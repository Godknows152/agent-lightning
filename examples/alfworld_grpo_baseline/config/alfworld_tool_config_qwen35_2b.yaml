# Qwen3.5-2B-only ALFWorld tool configuration.
# Qwen3.5-9B and Qwen2.5 profiles keep the shared tool configuration.
tools:
  - class_name: "alfworld_baseline.alfworld_tool.ALFWorldTool"
    config:
      type: native
      # One shared decision budget, including failed/invalid attempts.
      max_steps: 16
      environment_driven: true
      # Bound replay memory together with the 16-decision budget.
      max_new_tokens_per_turn: 256
      # Reuse initialized TextWorld instances in the 2B AgentLoop workers.
      # The pool is per worker and each acquire reloads the requested game file,
      # so no trajectory state is shared between concurrent rollouts.
      env_pool_size: 16
    tool_schema:
      type: function
      function:
        name: alfworld_action
        description: Execute exactly one ALFWorld text action. Copy the action from the current admissible action list.
        parameters:
          type: object
          properties:
            action:
              type: string
              description: One exact action string from the current admissible action list.
          required: [action]
          additionalProperties: false
