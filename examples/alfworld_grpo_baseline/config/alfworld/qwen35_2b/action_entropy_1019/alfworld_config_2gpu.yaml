# New training from merged raw-RL step150; no thinking/action consistency bonus.
# First non-listing exact thinking mention only; native legal-branch entropy coefficient 0.0005.
hydra:
  searchpath:
  - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
  - file:///home/LXJ/Python_Projects/verl/verl/trainer/config
defaults:
- /alfworld_common_config_2gpu
- /model_profiles@_global_: qwen35_2b
- _self_
variables:
  NUM_ROLLOUTS: 8
  PROMPT_VERSION: alfworld_gigpo_qwen3_xml_v3
  SFT_ADAPTER: null
  SFT_MODEL: /home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/outputs/qwen3.5_2B/新动作熵1019/base_model_step150
  THINKING_ACTION_REPEAT_REWARD: 0.0
  BRANCH_ENTROPY_ELIGIBLE_REWARD: 0.05
  SWANLAB_NEW_RUN_ON_RESUME: false
data:
  apply_chat_template_kwargs:
    enable_thinking: true
    avoid_repeated_actions: false
  train_batch_size: 16
actor_rollout_ref:
  # Avoid multi-GiB CPU pinning failures on this host; reference math is unchanged.
  reference_resident: true
  rollout:
    val_kwargs:
      temperature: ${actor_rollout_ref.rollout.temperature}
      top_p: ${actor_rollout_ref.rollout.top_p}
      top_k: ${actor_rollout_ref.rollout.top_k}
      'n': 1
      do_sample: true
    enable_chunked_prefill: true
    enforce_eager: false
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 16
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 24576
    agent:
      num_workers: 8
  ref:
    fsdp_config:
      param_offload: false
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
  actor:
    optim:
      _target_: alfworld_baseline.optimizer_config.ALFWorldFSDPOptimizerConfig
      lr: 3.0e-06
      init_lr_ratio: 0.0  # Native scheduler; zero warmup starts directly at peak lr.
      lr_scheduler_type: cosine
      min_lr_ratio: 0.3333333333333333
      num_cycles: 0.5
      lr_warmup_steps: 0
      lr_warmup_steps_ratio: 0.0
    calculate_entropy: true
    use_kl_loss: true
    entropy_coeff: 0.001
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 2
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 24576
    fsdp_config:
      ulysses_sequence_parallel_size: 1
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: false
      use_no_sync_for_gradient_accumulation: true
      entropy_checkpointing: false
    ulysses_sequence_parallel_size: 1
  model:
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_fused_kernels: false
    use_remove_padding: true
  branch_entropy:
    enabled: true
    coefficient: 0.0007
    mention_selection: first_non_listing
trainer:
  experiment_name: 新动作熵1019
  resume_mode: auto
  total_epochs: 3
  total_training_steps: null
  default_local_dir: /home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/outputs/qwen3.5_2B/新动作熵1019
  resume_from_path: null
algorithm:
  use_kl_in_reward: false
  rollout_correction:
    bypass_mode: true
ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: 'false'
