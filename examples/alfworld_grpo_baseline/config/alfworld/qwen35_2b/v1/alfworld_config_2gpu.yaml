# ALFWorld GRPO v1 for Qwen3.5-2B using the GiGPO context with Qwen3 XML tool calls.
hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
    - file:///home/LXJ/Python_Projects/verl/verl/trainer/config

defaults:
  - /alfworld_common_config_2gpu
  - /model_profiles@_global_: qwen35_2b
  - _self_

# Match the 2B profile's sampling scale and selected memory-saving settings.
variables:
  NUM_ROLLOUTS: 8
  PROMPT_VERSION: alfworld_gigpo_qwen3_xml_v1

data:
  apply_chat_template_kwargs:
    enable_thinking: true
    avoid_repeated_actions: true
  train_batch_size: 4

actor_rollout_ref:
  rollout:
    # Chunk long prompt prefill to reduce rollout peak memory.
    enable_chunked_prefill: true
    # Preserve token log-probs produced during rollout so old-log-prob
    # recomputation can be bypassed for this experiment.
    enforce_eager: false
    calculate_log_probs: true
    agent:
      num_workers: 8
  ref:
    # Native veRL LoRA reference disables adapters and uses the frozen base model.
    log_prob_micro_batch_size_per_gpu: 4

  actor:
    calculate_entropy: true
    # Enable KL against the frozen base policy. With LoRA, VERL computes
    # reference log-probs by disabling adapters on the shared actor engine.
    use_kl_loss: true
    entropy_coeff: 0.005
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_mini_batch_size: 4
    # Keep each backward micro-batch small for the standard FSDP training path.
    ppo_micro_batch_size_per_gpu: 4
    fsdp_config:
      # LoRA leaves only adapter parameters trainable, so CPU offload is no
      # longer needed for the optimizer and costs a host-device transfer.
      param_offload: false
      optimizer_offload: false
      entropy_checkpointing: false
  model:
    # Initialize RL from the completed thinking-enabled XML-format SFT adapter.
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/alfworld_tool_sft/outputs/qwen35_2b_xml_thinking_teacher_v1_20260914_093608_175508/adapter
    # Train adapters instead of the full 2B parameter set.
    lora_rank: 16
    lora_alpha: 32
    # Keep PEFT's adapter set within SGLang's LoRA memory-pool support.
    # ``all-linear`` also selects Qwen3.5 Mamba projections, which SGLang's
    # current dynamic LoRA path cannot load from tensors.
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    # Use available 2B memory to avoid activation recomputation.
    enable_gradient_checkpointing: true
    # Keep CPU activation transfers disabled.
    enable_activation_offload: false
    # Compute PPO log-probs and entropy with the memory-efficient fused head.
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch

trainer:
  experiment_name: qwen3.5_2B_0920
  resume_mode: auto
  default_local_dir: /home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/outputs/qwen3.5_2B

algorithm:
  # Apply reference KL in the actor loss only, not a second time in rewards.
  use_kl_in_reward: false
  rollout_correction:
    # Use rollout_log_probs as old_log_probs and skip a second actor pass.
    bypass_mode: true
