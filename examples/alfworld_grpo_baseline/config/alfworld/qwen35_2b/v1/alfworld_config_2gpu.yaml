# ALFWorld GRPO v1 for Qwen3.5-2B using the GiGPO context with Qwen3 XML tool calls.
hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
    - file:///home/LXJ/Python_Projects/verl/verl/trainer/config

defaults:
  - /alfworld_common_config_2gpu
  - /model_profiles@_global_: qwen35_2b
  - _self_

# Keep the sampling scale; tune execution for two A800 80GB GPUs.
variables:
  NUM_ROLLOUTS: 8
  PROMPT_VERSION: alfworld_gigpo_qwen3_xml_v3
  # Inherit the merged SFT checkpoint-100 from model_profiles/qwen35_2b.yaml.

data:
  apply_chat_template_kwargs:
    enable_thinking: true
    avoid_repeated_actions: false
  train_batch_size: 16

actor_rollout_ref:
  rollout:
    # Validation uses the training sampling settings, including trajectories per task.
    val_kwargs:
      temperature: ${actor_rollout_ref.rollout.temperature}
      top_p: ${actor_rollout_ref.rollout.top_p}
      top_k: ${actor_rollout_ref.rollout.top_k}
      n: ${actor_rollout_ref.rollout.n}
      do_sample: true
    # Chunk long prompt prefill to reduce rollout peak memory.
    enable_chunked_prefill: true
    # Preserve token log-probs produced during rollout so old-log-prob
    # recomputation can be bypassed for this experiment.
    enforce_eager: false
    calculate_log_probs: true
    # Keep rollout and reference inference micro-batches independently sized.
    log_prob_micro_batch_size_per_gpu: 16
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 24576
    agent:
      num_workers: 8
  ref:
    # A separate frozen reference loads the same merged SFT model as the actor.
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536

  actor:
    optim:
      lr: 3.0e-6
      lr_scheduler_type: cosine
      # Warm up for 20% of training, then decay from 3e-6 to 1e-6 over a half-cosine.
      min_lr_ratio: 0.3333333333333333
      num_cycles: 0.5
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.2
    calculate_entropy: true
    # Regularize against the frozen initial policy.
    use_kl_loss: true
    entropy_coeff: 0.001
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_mini_batch_size: 16
    # Keep the global PPO mini-batch at 128 step rows. Dynamic micro-batches
    # respect the packed token budget instead of fixing the number of rows.
    ppo_micro_batch_size_per_gpu: 2
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 24576
    fsdp_config:
      # Retain state on GPU and synchronize accumulated gradients once.
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: false
      use_no_sync_for_gradient_accumulation: true
      entropy_checkpointing: false
  model:
    # Initialize full parameters from the merged ALFWorld SFT checkpoint-100.
    # Keep activation checkpointing: disabling it at larger batches caused OOM.
    enable_gradient_checkpointing: true
    # Keep CPU activation transfers disabled.
    enable_activation_offload: false
    # The installed Liger lacks the scaled cross-entropy op imported by veRL's
    # fused head. Use the standard head for both reference and actor forwards.
    use_fused_kernels: false

trainer:
  experiment_name: 1001_success_repeat_exempt_from150
  resume_mode: auto
  total_epochs: 3
  # Native veRL derives the budget from dataset size and train_batch_size.
  total_training_steps: null
  # This experiment has its own checkpoint and tracking directory.
  default_local_dir: /home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/outputs/qwen3.5_2B/1001_success_repeat_exempt_from150

algorithm:
  # Apply reference KL in the actor loss only, not a second time in rewards.
  use_kl_in_reward: false
  rollout_correction:
    # Use rollout_log_probs as old_log_probs and skip a second actor pass.
    bypass_mode: true

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        # Allow unequal free GPU memory at SGLang startup; log a warning only.
        SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: "false"
