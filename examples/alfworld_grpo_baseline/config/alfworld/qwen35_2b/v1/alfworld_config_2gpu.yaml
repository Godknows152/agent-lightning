# ALFWorld GRPO v1 for Qwen3.5-2B and its native XML tool calls.
hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - /alfworld_common_config_2gpu
  - /model_profiles@_global_: qwen35_2b
  - _self_

# All performance changes in this file are Qwen3.5-2B-specific.  The Qwen3.5-9B
# profile continues to inherit the unmodified shared ALFWorld configuration.
variables:
  TOOL_CONFIG: /home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config/alfworld_tool_config_qwen35_2b.yaml
  # Keep each GRPO update small enough for a fast first step while retaining
  # multiple samples per prompt for a useful group-relative advantage.
  NUM_ROLLOUTS: 4

data:
  train_batch_size: 8
  val_batch_size: 8
  max_response_length: 2048

actor_rollout_ref:
  rollout:
    agent:
      num_workers: 4
    multi_turn:
      max_user_turns: 30
      max_assistant_turns: 30
      max_generated_response_length: 2048
  actor:
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 2
    entropy_coeff: 0.02
    # Apply a conservative explicit KL penalty against the frozen reference
    # policy. Keep reward-side KL disabled to avoid penalizing the same drift
    # twice.
    use_kl_loss: true
    kl_loss_coef: 0.004
    kl_loss_type: low_var_kl
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  ref:
    fsdp_config:
      param_offload: true
  model:
    enable_gradient_checkpointing: true
