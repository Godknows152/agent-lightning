# ALFWorld GRPO v1 for Qwen3.5-2B, aligned with the current Qwen3.5-9B training settings.
hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - /alfworld_common_config_2gpu
  - /model_profiles@_global_: qwen35_2b
  - _self_

# Keep non-model training settings aligned with the Qwen3.5-9B profile.
variables:
  NUM_ROLLOUTS: 4

data:
  train_batch_size: 8

actor_rollout_ref:
  rollout:
    # Preserve token log-probs produced during rollout so old-log-prob
    # recomputation can be bypassed for this experiment.
    calculate_log_probs: true
    agent:
      num_workers: 4
  actor:
    ppo_mini_batch_size: 8
    # Keep each backward micro-batch small for the standard FSDP training path.
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      # LoRA leaves only adapter parameters trainable, so CPU offload is no
      # longer needed for the optimizer and costs a host-device transfer.
      param_offload: false
      optimizer_offload: false
      entropy_checkpointing: true
  model:
    # Train adapters instead of the full model parameter set.
    lora_rank: 16
    lora_alpha: 32
    # Keep PEFT's adapter set within SGLang's LoRA memory-pool support.
    # ``all-linear`` also selects Qwen3.5 Mamba projections, which SGLang's
    # current dynamic LoRA path cannot load from tensors.
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    # Keep activation checkpointing without CPU activation transfers.
    enable_activation_offload: false
    # Compute PPO log-probs and entropy with the memory-efficient fused head.
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch

algorithm:
  rollout_correction:
    # Use rollout_log_probs as old_log_probs and skip a second actor pass.
    bypass_mode: true
