# ALFWorld GRPO v1 for Qwen3.5-2B and its native XML tool calls.
hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - /alfworld_common_config_2gpu
  - /model_profiles@_global_: qwen35_2b
  - _self_

# All performance changes in this file are Qwen3.5-2B-specific.  The Qwen3.5-9B
# profile continues to inherit the unmodified shared ALFWorld configuration.
variables:
  TOOL_CONFIG: /home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config/alfworld_tool_config_qwen35_2b.yaml
  # Keep the replay-expanded GRPO update within the 80-GiB GPU budget.
  # Two samples still provide a valid group-relative comparison.
  NUM_ROLLOUTS: 2

data:
  # Qwen3.5-2B only: emit a tool call directly, without generated reasoning.
  apply_chat_template_kwargs:
    enable_thinking: false
  train_batch_size: 4
  val_batch_size: 4
  # Storage only: recomputed from tool max_steps * max_new_tokens_per_turn
  # by the ALFWorld entrypoint before worker creation. Not a rollout cutoff.
  max_response_length: 4096

actor_rollout_ref:
  rollout:
    agent:
      num_workers: 4
    multi_turn:
      max_user_turns: null
      max_assistant_turns: null
      max_generated_response_length: null
  actor:
    # Replay expands every trajectory into per-turn prompts; use a small actor
    # update batch because backward activations dominate memory.
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    entropy_coeff: 0.02
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      # Recompute entropy intermediates instead of keeping them through the actor forward.
      entropy_checkpointing: true
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
  model:
    enable_gradient_checkpointing: true
    # Keep checkpointed layer activations on CPU between forward and backward.
    enable_activation_offload: true
