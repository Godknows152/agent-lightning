# ALFWorld GRPO v1 for Qwen3.5-9B using the GiGPO context with Qwen3 XML tool calls.
hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
    - file:///home/LXJ/Python_Projects/verl/verl/trainer/config

defaults:
  - /alfworld_common_config_2gpu
  - /model_profiles@_global_: qwen35_9b
  - _self_

variables:
  PROMPT_VERSION: alfworld_gigpo_qwen3_xml_v1
  NUM_ROLLOUTS: 3

data:
  train_batch_size: 16

actor_rollout_ref:
  rollout:
    # Preserve token log-probs produced during rollout so old-log-prob
    # recomputation can be bypassed for this experiment.
    calculate_log_probs: true
    agent:
      num_workers: 4
  actor:
    calculate_entropy: true
    # Regularize against the frozen SFT policy.
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_mini_batch_size: 8
    # Keep each backward micro-batch small for the standard FSDP training path.
    ppo_micro_batch_size_per_gpu: 2
    fsdp_config:
      # Offload full model/optimizer state between rollout and training phases.
      param_offload: true
      optimizer_offload: true
      entropy_checkpointing: true
  model:
    # The profile points to a standalone model with the SFT adapter merged.
    # Full-parameter backward requires activation checkpointing.
    enable_gradient_checkpointing: true
    # Keep CPU activation transfers disabled.
    enable_activation_offload: false
    # Compute PPO log-probs and entropy with the memory-efficient fused head.
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch

trainer:
  resume_mode: auto
  default_local_dir: /home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/outputs/alfworld/qwen35_9b/full_sft/v1/2gpu/seed0

algorithm:
  # Apply reference KL in the actor loss only, not a second time in rewards.
  use_kl_in_reward: false
  rollout_correction:
    # Use rollout_log_probs as old_log_probs and skip a second actor pass.
    bypass_mode: true
