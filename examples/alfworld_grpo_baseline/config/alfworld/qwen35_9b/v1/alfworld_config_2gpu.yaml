# ALFWorld GRPO v1 for Qwen3.5-9B and its native XML tool calls.
hydra:
  searchpath:
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/alfworld_grpo_baseline/config
    - file:///home/LXJ/Python_Projects/Agent_Lightning/examples/image_restoration_multi_agent/verl_backend/verl/trainer/config

defaults:
  - /alfworld_common_config_2gpu
  - /model_profiles@_global_: qwen35_9b
  - _self_

# Match the 2B profile's sampling scale and selected memory-saving settings.
variables:
  NUM_ROLLOUTS: 4

data:
  train_batch_size: 8

actor_rollout_ref:
  rollout:
    # Preserve token log-probs produced during rollout so old-log-prob
    # recomputation can be bypassed for this experiment.
    calculate_log_probs: true
    agent:
      num_workers: 4
  actor:
    calculate_entropy: true
    # Enable KL against the frozen base policy. With LoRA, VERL computes
    # reference log-probs by disabling adapters on the shared actor engine.
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_mini_batch_size: 8
    # Keep each backward micro-batch small for the standard FSDP training path.
    ppo_micro_batch_size_per_gpu: 2
    # Bound turn-level replay so long ALFWorld histories do not form one
    # oversized forward/backward activation graph.
    turn_context_chunk_tokens: 16384
    fsdp_config:
      # LoRA leaves only adapter parameters trainable, so CPU offload is no
      # longer needed for the optimizer and costs a host-device transfer.
      param_offload: false
      optimizer_offload: false
      entropy_checkpointing: true
  model:
    # Initialize RL from the completed non-thinking XML-format SFT adapter.
    lora_adapter_path: /home/LXJ/Python_Projects/Agent_Lightning/LlamaFactory/alfworld_tool_sft/outputs/qwen35_9b_xml_nothink_v1_20260911_235833_235341/adapter/checkpoint-320
    # Train adapters instead of the full 9B parameter set.
    lora_rank: 16
    lora_alpha: 32
    # Keep PEFT's adapter set within SGLang's LoRA memory-pool support.
    # ``all-linear`` also selects Qwen3.5 Mamba projections, which SGLang's
    # current dynamic LoRA path cannot load from tensors.
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    # Retain 16384-token replay chunks, but restore checkpointing after actor OOM.
    enable_gradient_checkpointing: true
    # Keep CPU activation transfers disabled.
    enable_activation_offload: false
    # Compute PPO log-probs and entropy with the memory-efficient fused head.
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch

algorithm:
  # Apply reference KL in the actor loss only, not a second time in rewards.
  use_kl_in_reward: false
  rollout_correction:
    # Use rollout_log_probs as old_log_probs and skip a second actor pass.
    bypass_mode: true
