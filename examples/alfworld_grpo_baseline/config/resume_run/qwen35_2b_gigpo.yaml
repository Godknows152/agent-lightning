# @package _global_
# Resume the latest checkpoint and its SwanLab identity when present.
# An empty output directory starts a new run.
trainer:
  resume_mode: auto
  resume_from_path: null
  # Keep this separate backend's existing budget independent of the 2B profile.
  total_epochs: 1
  total_training_steps: 150

ray_kwargs:
  ray_init:
    # ens121f0: do not auto-select the removable Mihomo TUN address (28.0.0.1).
    _node_ip_address: ${oc.env:ALFWORLD_RAY_NODE_IP,10.246.1.30}
