<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132238">
  <title>鹈鹕的天气骑行</title>
  <style>
    :root {
      --ink: #f7fbff;
      --muted: rgba(239, 247, 255, .72);
      --panel: rgba(13, 28, 49, .68);
      --panel-border: rgba(255, 255, 255, .14);
      --accent: #ffcf62;
      --scene-sky-top: #70c9ef;
      --scene-sky-bottom: #edf8ff;
      --scene-hill-back: #9bd18b;
      --scene-hill-front: #5ba36b;
      --scene-ground: #e7f1d3;
      --scene-road: #38536a;
      --scene-road-line: #f9e18c;
      --scene-water: #67cbd2;
      --scene-shadow: rgba(28, 56, 72, .22);
      --weather-filter: none;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(52, 146, 197, .3), transparent 35%),
        linear-gradient(145deg, #0d1c30 0%, #172c47 52%, #0d1729 100%);
      overflow-x: hidden;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      padding: clamp(18px, 4vw, 38px) 0;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(1.85rem, 5vw, 4rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 590px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(.9rem, 1.5vw, 1.08rem);
      line-height: 1.55;
    }

    .weather-readout {
      min-width: 172px;
      padding: 14px 16px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: right;
      box-shadow: 0 16px 38px rgba(0, 0, 0, .18);
    }

    .weather-icon {
      display: block;
      font-size: 1.7rem;
      line-height: 1;
      margin-bottom: 6px;
    }

    .weather-name {
      display: block;
      font-weight: 800;
      font-size: 1rem;
    }

    .weather-next {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .72rem;
    }

    .scene-shell {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: clamp(22px, 4vw, 34px);
      background: #163654;
      box-shadow: 0 28px 70px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255,255,255,.14);
    }

    .scene-shell::after {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      background: var(--weather-filter);
      transition: background 1.15s ease;
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
      min-height: clamp(390px, 52vw, 625px);
      background: var(--scene-sky-bottom);
    }

    .scene * { vector-effect: non-scaling-stroke; }

    .sky, .hills, .ground, .road, .weather, .sun, .clouds, .rain, .bird, .bike, .birds-far, .wind, .dashes { transition: opacity 1.15s ease, filter 1.15s ease; }

    .sun { transform-box: fill-box; transform-origin: center; animation: sun-pulse 5s ease-in-out infinite; }
    .sun-ray { transform-box: fill-box; transform-origin: center; animation: ray-spin 26s linear infinite; }

    .clouds { opacity: 0; }
    .clouds.cloud-a { animation: cloud-drift-a 25s linear infinite; }
    .clouds.cloud-b { animation: cloud-drift-b 32s linear infinite; }

    .bike-wheel { transform-box: fill-box; transform-origin: center; animation: wheel-roll .8s linear infinite; }
    .pedal-crank { transform-box: fill-box; transform-origin: center; animation: pedal-turn 1.05s linear infinite; }
    .pelican-body { transform-box: fill-box; transform-origin: center bottom; animation: body-bob 1.05s ease-in-out infinite; }
    .pelican-head { transform-box: fill-box; transform-origin: center bottom; animation: head-bob 1.05s ease-in-out infinite; }
    .leg-a { transform-box: fill-box; transform-origin: top center; animation: leg-pump-a 1.05s ease-in-out infinite; }
    .leg-b { transform-box: fill-box; transform-origin: top center; animation: leg-pump-b 1.05s ease-in-out infinite; }
    .wind-line { animation: wind-sweep 3.7s linear infinite; }
    .wind-line:nth-child(2) { animation-delay: -1.4s; }
    .wind-line:nth-child(3) { animation-delay: -2.5s; }

    .rain { opacity: 0; }
    .rain-line { animation: rain-fall .85s linear infinite; }
    .rain-line:nth-child(2n) { animation-delay: -.4s; }
    .rain-line:nth-child(3n) { animation-delay: -.7s; }

    .road-dash { animation: road-move 1.15s linear infinite; }
    .road-dash:nth-child(2n) { animation-delay: -.55s; }

    .weather--sunny .sun { opacity: 1; }
    .weather--sunny .clouds { opacity: .12; }
    .weather--sunny .rain { opacity: 0; }
    .weather--sunny .wind { opacity: .32; }
    .weather--sunny .scene-shell { --weather-filter: none; }

    .weather--cloudy .sun { opacity: .25; filter: saturate(.6); }
    .weather--cloudy .clouds { opacity: .9; }
    .weather--cloudy .rain { opacity: 0; }
    .weather--cloudy .wind { opacity: .2; }
    .weather--cloudy .scene-shell { --weather-filter: rgba(52, 67, 91, .12); }

    .weather--rainy .sun { opacity: 0; }
    .weather--rainy .clouds { opacity: 1; }
    .weather--rainy .rain { opacity: .92; }
    .weather--rainy .wind { opacity: .08; }
    .weather--rainy .scene-shell { --weather-filter: rgba(14, 35, 67, .26); }

    .scene-label {
      position: absolute;
      z-index: 5;
      left: clamp(16px, 3vw, 32px);
      bottom: clamp(16px, 3vw, 30px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      color: #fff;
      background: rgba(11, 30, 47, .55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: clamp(.68rem, 1.2vw, .82rem);
      letter-spacing: .02em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #74f7a3;
      box-shadow: 0 0 0 4px rgba(116,247,163,.16), 0 0 16px rgba(116,247,163,.7);
      animation: live-pulse 1.6s ease-in-out infinite;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .timeline-item {
      display: grid;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      background: rgba(255,255,255,.055);
      color: var(--muted);
      font-size: .78rem;
    }

    .timeline-item strong { color: var(--ink); font-size: .82rem; }

    .timeline-bar {
      position: relative;
      height: 4px;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,.13);
    }

    .timeline-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #74f7a3);
      transition: width .2s linear;
    }

    .footer-note {
      margin: 13px 0 0;
      color: rgba(239,247,255,.47);
      font-size: .72rem;
      text-align: center;
    }

    @keyframes sun-pulse { 0%, 100% { transform: scale(.97); } 50% { transform: scale(1.04); } }
    @keyframes ray-spin { to { transform: rotate(360deg); } }
    @keyframes cloud-drift-a { 0%, 100% { transform: translateX(-2%); } 50% { transform: translateX(2%); } }
    @keyframes cloud-drift-b { 0%, 100% { transform: translateX(2%); } 50% { transform: translateX(-2%); } }
    @keyframes wheel-roll { to { transform: rotate(360deg); } }
    @keyframes pedal-turn { to { transform: rotate(360deg); } }
    @keyframes body-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.2px); } }
    @keyframes head-bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-3px) rotate(1deg); } }
    @keyframes leg-pump-a { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(-18deg); } }
    @keyframes leg-pump-b { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(14deg); } }
    @keyframes wind-sweep { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 75% { opacity: .8; } 100% { transform: translateX(90px); opacity: 0; } }
    @keyframes rain-fall { from { transform: translateY(-18px); } to { transform: translateY(45px); } }
    @keyframes road-move { from { transform: translateX(0); } to { transform: translateX(-92px); } }
    @keyframes live-pulse { 0%, 100% { opacity: .65; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.1); } }

    @media (max-width: 680px) {
      .app { width: min(100% - 20px, 560px); padding-top: 20px; }
      .topbar { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 13px; }
      .weather-readout { min-width: 112px; padding: 10px 11px; }
      .weather-icon { font-size: 1.4rem; }
      .weather-name { font-size: .86rem; }
      .weather-next { font-size: .65rem; }
      .intro { line-height: 1.45; }
      .scene { min-height: 510px; }
      .timeline { gap: 7px; }
      .timeline-item { padding: 10px 9px; font-size: .68rem; }
      .timeline-item strong { font-size: .73rem; }
    }

    @media (max-width: 390px) {
      .topbar { grid-template-columns: 1fr; }
      .weather-readout { display: flex; align-items: center; gap: 9px; width: max-content; }
      .weather-icon { margin: 0; }
      .weather-next { margin: 0; }
      .scene { min-height: 540px; }
      .timeline-item { padding: 9px 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

    <section class="timeline" aria-label="天气切换进度">
      <div class="timeline-item" data-state="sunny"><strong>☀️ 晴天</strong><span>海风轻轻吹</span><div class="timeline-bar"><span class="timeline-fill"></span></div></div>
      <div class="timeline-item" data-state="cloudy"><strong>☁️ 阴天</strong><span>云朵开始聚会</span><div class="timeline-bar"><span class="timeline-fill"></span></div></div>
      <div class="timeline-item" data-state="rainy"><strong>🌧️ 雨天</strong><span>雨点落在车铃上</span><div class="timeline-bar"><span class="timeline-fill"></span></div></div>
    </section>
    <p class="footer-note">每种天气停留 5 秒 · 画面会自动适配手机竖屏与电脑横屏</p>
  </main>

  <script>
    (() => {
      const states = [
        { key: 'sunny', icon: '☀️', name: '晴天骑行', next: '阴天', label: '阳光正好，继续出发' },
        { key: 'cloudy', icon: '☁️', name: '阴天骑行', next: '雨天', label: '云朵路过，风变柔了' },
        { key: 'rainy', icon: '🌧️', name: '雨天骑行', next: '晴天', label: '雨点落下，铃声更清脆' }
      ];
      const duration = 5000;
      const body = document.body;
      const name = document.getElementById('weatherName');
      const icon = document.getElementById('weatherIcon');
      const next = document.getElementById('weatherNext');
      const status = document.getElementById('sceneStatus');
      const cards = [...document.querySelectorAll('.timeline-item')];
      let startedAt = performance.now();
      let currentIndex = 0;

      function render(index, now) {
        const state = states[index];
        currentIndex = index;
        body.classList.remove(...states.map(item => `weather--${item.key}`));
        body.classList.add(`weather--${state.key}`);
        icon.textContent = state.icon;
        name.textContent = state.name;
        next.textContent = `下一站：${state.next} · 05 秒`;
        status.textContent = state.label;
        cards.forEach((card, cardIndex) => {
          card.style.opacity = cardIndex === index ? '1' : '.68';
          card.style.borderColor = cardIndex === index ? 'rgba(255, 207, 98, .48)' : 'rgba(255,255,255,.1)';
        });
        startedAt = now;
      }

      function tick(now) {
        const elapsed = now - startedAt;
        if (elapsed >= duration) {
          render((currentIndex + Math.floor(elapsed / duration)) % states.length, now);
        }
        const progress = Math.min(1, (now - startedAt) / duration);
        cards.forEach((card, cardIndex) => {
          const fill = card.querySelector('.timeline-fill');
          fill.style.width = cardIndex === currentIndex ? `${progress * 100}%` : '0%';
        });
        const seconds = Math.max(1, Math.ceil((duration - (now - startedAt)) / 1000));
        next.textContent = `下一站：${states[(currentIndex + 1) % states.length].name.replace('骑行', '')} · ${String(seconds).padStart(2, '0')} 秒`;
        requestAnimationFrame(tick);
      }

      render(0, startedAt);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
